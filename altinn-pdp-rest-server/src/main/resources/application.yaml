server:
  port: "$PORT:8080"

altinn:
  environment: "$ALTINN_ENVIRONMENT"
  subscriptionKey: "$ALTINN_SUBSCRIPTION_KEY"

maskinporten:
  clientId: "$MASKINPORTEN_CLIENT_ID"
  clientJwk: "$MASKINPORTEN_CLIENT_JWK"

decisionCache:
  enabled: "$?DECISION_CACHE_ENABLED"
  timeToLiveSeconds: "$?DECISION_CACHE_TIME_TO_LIVE_SECONDS"
  defaultMaxAgeSeconds: "$?DECISION_CACHE_DEFAULT_MAX_AGE_SECONDS"
  maximumSize: "$?DECISION_CACHE_MAXIMUM_SIZE"

accessLog:
  enabled: "$?ACCESS_LOG_ENABLED"

logback:
  configFile: "$?LOGBACK_CONFIG_FILE"
