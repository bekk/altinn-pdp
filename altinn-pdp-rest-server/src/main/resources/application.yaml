ktor:
  application:
    modules:
      - no.kartverket.altinnpdp.restserver.MainKt.module
  deployment:
    port: 8080

altinn:
  environment: "$ALTINN_ENVIRONMENT:TT02"
  subscriptionKey: "$ALTINN_SUBSCRIPTION_KEY"

maskinporten:
  clientId: "$MASKINPORTEN_CLIENT_ID"
  clientJwk: "$MASKINPORTEN_CLIENT_JWK"
  # Left absent rather than defaulted, because the right fallback depends on altinn.environment
  # (PROD uses maskinporten.no) and PdpClient already picks it from there.
  tokenUrl: "$?MASKINPORTEN_TOKEN_URL"

# See "Timeouts" in the README.
timeouts:
  requestMs: "$?ALTINN_REQUEST_TIMEOUT_MS"
  totalMs: "$?ALTINN_TOTAL_TIMEOUT_MS"
