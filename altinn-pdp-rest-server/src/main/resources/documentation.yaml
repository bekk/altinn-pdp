openapi: "3.0.3"
info:
  title: "Altinn PDP REST API"
  description: "Simplified JSON REST API for the Altinn PDP"
  version: "0.1.0"
servers:
  - url: "http://localhost:8080"
paths:
  /health/live:
    get:
      summary: "Liveness probe"
      description: "Returns 200 OK if the server is up. Not part of the stable API."
      responses:
        "200":
          description: "OK"
  /authorize:
    post:
      summary: "Check whether a systembruker is authorized"
      description: >
        Asks the Altinn PDP whether the systembruker identified by [systemuserId] has been
        delegated [action] on [resourceId] for the party identified by [organizationNumber].
        The Altinn subscription key and Maskinporten token are configured server-side; the
        caller never supplies them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
            examples:
              Example#1:
                value:
                  systemuserId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  resourceId: "altinn_access_management"
                  organizationNumber: "923609016"
                  action: "read"
      responses:
        "200":
          description: "The PDP's decision."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
              examples:
                Permit:
                  value:
                    permit: true
                    decision: "PERMIT"
                    status: "urn:oasis:names:tc:xacml:1.0:status:ok"
                    minimumAuthenticationLevel: 3
                    minimumAuthenticationLevelOrg: 3
                Deny:
                  value:
                    permit: false
                    decision: "DENY"
                    status: "urn:oasis:names:tc:xacml:1.0:status:ok"
                NotEvaluated:
                  value:
                    permit: false
                    decision: "INDETERMINATE"
                    status: "urn:oasis:names:tc:xacml:1.0:status:processing-error"
        "400":
          description: >
            The request could not be understood - a missing or blank field, a malformed
            organizationNumber, or a malformed JSON body. Note that an unknown resourceId is not
            a 400: Altinn answers 200 with decision INDETERMINATE and a processing-error status,
            which this API passes through in the "status" field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                MissingField:
                  value:
                    error: "Missing required field: systemuserId"
                MissingFields:
                  value:
                    error: "Missing required fields: systemuserId, resourceId"
                BlankField:
                  value:
                    error: "systemuserId is required"
                InvalidOrganizationNumber:
                  value:
                    error: "organizationNumber must be exactly 9 digits"
        "502":
          description: >
            The call to Altinn or Maskinporten failed for a reason unrelated to this request's
            content - the PDP itself errored, or a token could not be obtained. The response never
            includes Altinn's own error details; those are logged server-side instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example#1:
                  value:
                    error: "The call to Altinn failed"
        "500":
          description: "An unanticipated server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example#1:
                  value:
                    error: "Internal server error"
components:
  schemas:
    AuthorizeRequest:
      type: "object"
      required:
        - "systemuserId"
        - "resourceId"
        - "organizationNumber"
        - "action"
      properties:
        systemuserId:
          type: "string"
          description: "The systembruker id from the token's authorization_details."
        resourceId:
          type: "string"
          description: "The resource's identifier in the Altinn Resource Registry."
        organizationNumber:
          type: "string"
          pattern: "^[0-9]{9}$"
          description: >
            The plain Norwegian org number (exactly 9 digits) of the party whose access is being
            checked - the customer/business systemuserId is acting on behalf of, e.g. "923609016".
            Not the caller's own org number, and not the ISO6523-prefixed form Maskinporten tokens
            use.
        action:
          type: "string"
          description: "e.g. \"read\" or \"write\"."
    AuthorizeResponse:
      type: "object"
      required:
        - "permit"
        - "decision"
      properties:
        permit:
          type: "boolean"
          description: "Whether the request is permitted - shorthand for decision == \"PERMIT\"."
        decision:
          type: "string"
          description: "The underlying XACML decision."
          enum:
            - "PERMIT"
            - "DENY"
            - "NOT_APPLICABLE"
            - "INDETERMINATE"
        status:
          type: "string"
          nullable: true
          description: >
            Altinn's XACML status URN. "...:status:ok" means the request was evaluated;
            "...:status:processing-error" means it could not be, which is how an unknown
            resourceId shows up. Omitted when Altinn sends no status.
        minimumAuthenticationLevel:
          type: "integer"
          nullable: true
          description: >
            From the urn:altinn:minimum-authenticationlevel obligation. When present on a PERMIT,
            the decision is conditional: the caller must confirm its own end user met at least
            this authentication level before acting on the permit. This API cannot check it, as
            it never sees the caller's token. Omitted when Altinn attaches no such obligation.
        minimumAuthenticationLevelOrg:
          type: "integer"
          nullable: true
          description: >
            As minimumAuthenticationLevel, but from the urn:altinn:minimum-authenticationlevel-org
            obligation.
    ErrorResponse:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
