name: Build image

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}-rest-server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, push and Pharos scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'kartverket'

    steps:
      - name: Checkout project sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="${REF#refs/heads/}"
            TAG="${TAG//\//-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine additional Jib tags
        id: jib_tags
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tags=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push with Jib
        env:
          JIB_TO_AUTH_USERNAME: ${{ github.actor }}
          JIB_TO_AUTH_PASSWORD: ${{ github.token }}
        run: |
          ./gradlew :altinn-pdp-rest-server:build :altinn-pdp-rest-server:jib \
            -PdockerImage=${{ env.registry }}/${{ env.image_name }}:${{ steps.image_tag.outputs.tag }} \
            -PdockerTags=${{ steps.jib_tags.outputs.tags }} \
            -Djib.to.auth.username="$JIB_TO_AUTH_USERNAME" \
            -Djib.to.auth.password="$JIB_TO_AUTH_PASSWORD"

      - name: Set output with build values
        id: set_output
        run: |
          echo "image_digest=$(cat altinn-pdp-rest-server/build/jib-image.digest)" >> "$GITHUB_OUTPUT"

    outputs:
      image_digest: ${{ steps.set_output.outputs.image_digest }}

  pharos:
    name: Run Pharos with Required Permissions
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Run Pharos
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 # v0.7.1
        with:
          image_url: "${{ env.registry }}/${{ env.image_name }}@${{ needs.build.outputs.image_digest }}"
          tfsec: false

  publish-digest:
    name: Publish image digest to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.build.outputs.image_digest }}
    steps:
      - name: Publish image.json to release
        run: |
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::Missing digest output: '$DIGEST'"; exit 1; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::warning::No release for tag $TAG, skipping image.json"
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg image "ghcr.io/${GITHUB_REPOSITORY}-rest-server" --arg digest "$DIGEST" \
            '{tag: $tag, image: $image, digest: $digest}' > image.json
          cat image.json
          gh release upload "$TAG" image.json --clobber --repo "$GITHUB_REPOSITORY"
