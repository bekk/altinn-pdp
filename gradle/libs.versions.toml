[versions]
kotlin = "2.4.21"
ktlint-cli = "1.8.0"
ktlint-gradle = "14.2.0"
logback = "1.6.5"
logstash-logback-encoder = "9.0"
jackson = "3.2.4"
netty = "4.2.19.Final"
jib = "3.5.4"
caffeine = "3.3.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
lettuce = "7.8.0.RELEASE"
jedis-mock = "1.1.19"
nimbus-jose-jwt = "10.10"
nocommons = "0.17.0"
zstd-jni = "1.5.7-24"

[libraries]
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
jedis-mock = { module = "com.github.fppt:jedis-mock", version.ref = "jedis-mock" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
nocommons = { module = "no.bekk.bekkopen:nocommons", version.ref = "nocommons" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
